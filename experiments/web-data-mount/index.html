<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TH08 Web local-data mount probe</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; background: #11131a; color: #f4f1ff; }
      main { padding: 2rem; border: 1px solid #41465b; border-radius: 1rem; background: #1a1d28; }
      label { display: block; margin: 1rem 0; }
      input { display: block; margin-top: .4rem; width: 100%; }
      button { padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #9b7cff; color: #100b21; font-weight: 700; }
      button:disabled { opacity: .5; }
      pre { min-height: 7rem; padding: 1rem; overflow-wrap: anywhere; white-space: pre-wrap; background: #0c0e14; border-radius: .5rem; }
      .policy { color: #c9c5d8; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <h1>TH08 Web local-data mount probe</h1>
      <p class="policy">Select <code>th08.dat</code> and <code>thbgm.dat</code> from a legally obtained copy. The files are passed to a Web Worker as local browser <code>File</code> objects; this page never uploads, bundles, or stores either retail file.</p>
      <label>Game data <input id="game-data" type="file" accept=".dat"></label>
      <label>Background music data <input id="bgm-data" type="file" accept=".dat"></label>
      <button id="inspect" disabled>Mount and inspect locally</button>
      <pre id="result" aria-live="polite">Waiting for both DAT files.</pre>
    </main>
    <script>
      const gameInput = document.querySelector("#game-data");
      const bgmInput = document.querySelector("#bgm-data");
      const button = document.querySelector("#inspect");
      const result = document.querySelector("#result");

      function selectedFiles() {
        return [gameInput.files[0], bgmInput.files[0]];
      }

      function validateSelection() {
        const [game, bgm] = selectedFiles();
        const valid = game?.name.toLowerCase() === "th08.dat" && bgm?.name.toLowerCase() === "thbgm.dat";
        button.disabled = !valid;
        result.textContent = valid
          ? `Selected ${game.name} (${game.size} bytes) and ${bgm.name} (${bgm.size} bytes).\nNot read yet.`
          : "Select local files named th08.dat and thbgm.dat.";
      }

      gameInput.addEventListener("change", validateSelection);
      bgmInput.addEventListener("change", validateSelection);
      button.addEventListener("click", () => {
        button.disabled = true;
        result.textContent = "Mounting WORKERFS inside a Web Worker…\n";
        const worker = new Worker("worker.js");
        worker.onmessage = (event) => {
          if (event.data.type === "log") result.textContent += `${event.data.line}\n`;
          if (event.data.type === "done") {
            result.textContent += event.data.status === 0 ? "Local range reads succeeded; no network upload occurred." : "Read failed.";
            worker.terminate();
            button.disabled = false;
          }
          if (event.data.type === "error") {
            result.textContent += `Error: ${event.data.message}`;
            worker.terminate();
            button.disabled = false;
          }
        };
        worker.onerror = (error) => {
          result.textContent += `Worker error: ${error.message}`;
          worker.terminate();
          button.disabled = false;
        };
        worker.postMessage({ type: "inspect", files: selectedFiles() });
      });
    </script>
  </body>
</html>
